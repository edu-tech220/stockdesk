name: stockdesk

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: stockdesk-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      # Valor de ejemplo SOLO para desarrollo local. Cámbielo y provéalo mediante
      # un secreto real (variable de entorno externa, Docker secret, etc.) en
      # cualquier entorno que no sea su máquina local.
      MSSQL_SA_PASSWORD: "Dev-only_P4ss!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - stockdesk-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: stockdesk-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=StockDesk;User Id=sa;Password=Dev-only_P4ss!;TrustServerCertificate=True;"
      # Clave de ejemplo SOLO para desarrollo. Use un valor largo, aleatorio y
      # secreto real en cualquier despliegue que no sea local.
      Jwt__Key: "dev-only-super-secret-key-change-me-in-production-0123456789"
      Jwt__Issuer: "StockDesk"
      Jwt__Audience: "StockDeskClients"
      Jwt__ExpirationMinutes: "120"
    ports:
      - "5080:8080"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: stockdesk-web
    depends_on:
      - api
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      Api__BaseUrl: "http://api:8080"
    ports:
      - "5081:8081"

volumes:
  stockdesk-sqlserver-data:
